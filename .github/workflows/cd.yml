name: CD

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    # The repository variable is enabled only after npm trusted publishing is
    # configured. A draft or prematurely published release therefore cannot
    # invoke npm publishing with an unfinished trust relationship.
    if: vars.NPM_TRUSTED_PUBLISHING_READY == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Refuse an already published version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "v${package_version}" != "${RELEASE_TAG}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${package_version}."
            exit 1
          fi
          if npm view "${package_name}@${package_version}" version --userconfig /dev/null --prefer-online >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already present in npm; refusing to publish it again."
            exit 1
          fi
      - run: npm publish --access public --provenance
